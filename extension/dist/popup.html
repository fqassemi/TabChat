<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <title>Tab RAG</title>
  <script src="popup.js" defer></script>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      width: 340px;
    }
    label { font-weight: bold; }
    input, select, button {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 10px;
      padding: 6px;
    }
    hr { margin: 12px 0; }
    #status, #configStatus, #apiKeyStatus {
      color: #444;
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<h1>TabChat</h1>
  <button id="loginBtn">Login with Google</button>

  <h3>LLM Configuration</h3>
  <label>OpenAI API Key:</label>
  <input type="password" id="openaiKey" placeholder="sk-..." />
  <button id="saveApiKey">Save API Key</button>
  <div id="apiKeyStatus"></div>

  <hr />

  <button id="collect">Collects Tabs</button>
  <div class="progress-container">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <div id="progressText" class="progress-text">
    0%
  </div>
  <hr />
  <button id="openOverlay">Search Tabs</button>
  <button id="chatBtn">Chat with this tab</button>

  <div id="status"></div>
  <hr>
  <div id="results"></div>
</body>
</html>
