<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <title>Tab RAG</title>
  <script src="popup.js" defer></script>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      width: 340px;
    }
    label { font-weight: bold; }
    input, select, button {
      width: 100%;
      margin-top: 4px;
      margin-bottom: 10px;
      padding: 6px;
    }
    hr { margin: 12px 0; }
    #status, #configStatus, #apiKeyStatus {
      color: #444;
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
<div class="app-header">
  <span class="app-title">TabChat</span>
</div>

<div id="loginCard" class="login-card">
  <button id="loginBtn" class="google-btn">
    <svg width="16" height="16" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
      <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-3.5z"/>
      <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/>
      <path fill="#4CAF50" d="M24 45c5.4 0 10.3-2 14-5.3l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.5 40.6 16.2 45 24 45z"/>
      <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.6l6.5 5.5C41.5 36.1 45 30.6 45 24c0-1.4-.1-2.7-.4-3.5z"/>
    </svg>
    Login with Google
  </button>
  <div id="loginStatus"></div>
  <button id="logoutBtn" class="logout-btn" style="display:none;">
    Logout
  </button>
</div>
<hr />
<!--  <h3>LLM Configuration</h3>-->
<details class="settings-block">
  <summary>ApiKey (optional)</summary><br>
  <label>API Key</label>
  <input type="password" id="chatApiKey" placeholder="sk-... or gsk_..." />
  <label>Endpoint</label>
  <input id="chatBaseUrl" placeholder="https://api.groq.com/openai/v1" />
  <button id="saveChatSettings">Save</button>
  <div id="chatSettingsStatus"></div>
</details>

<details class="settings-block">
  <summary>🗄️ Storage (optional)</summary>
  <label>Type</label>
  <select id="storageType">
    <option value="local">Our Storage (default)</option>
    <option value="scp">Your Storage</option>
  </select>
  <div id="scpSettings" style="display:none;">
    <label>Host</label>
    <input id="scpHost" placeholder="192.168.1.10">
    <label>Username</label>
    <input id="scpUsername">
    <label>Password</label>
    <input id="scpPassword" type="password">
    <label>Remote Path</label>
    <input id="scpRemotePath" placeholder="/home/user/tabchat">
  </div>
  <button id="saveStorage">Save</button>
  <div id="storageStatus"></div>
</details>
<hr>

  <button id="collect">Collects Tabs</button>
    <div id="collectStatus"></div>
  <div id="progressContainer" class="progress-container" style="display:none;">
    <div id="progressFill" class="progress-fill">
      <span id="progressText" class="progress-text">0%</span>
    </div>
  </div>
  <div id="closeTabsContainer" style="display:none;"></div>
  <div id="closeTabStatus"></div>
  <hr />
  <div class="action-row">
    <button id="openOverlay" class="icon-btn">🔍 Search</button>
    <button id="chatBtn" class="icon-btn">💬 Chat</button>
  </div>

  <div id="status"></div>

  <div id="results"></div>
  <hr>
  <button id="myTabsBtn" class="icon-btn full">📑 My Tabs</button>

  <div id="tabsContainer" style="display:none;">
    <input id="tabsSearch" placeholder="Search..." />
    <div id="tabsList"></div>
  </div>
  <button id="loadMoreBtn" style="display:none;">
    Load more...
  </button>
</body>
</html>
